apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mensageria
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      # Aplica as migrations antes de servir (idempotente entre réplicas).
      initContainers:
        - name: migrate
          image: mensageria-api:local
          command: ['node', 'dist/migrate.js']
          envFrom:
            - configMapRef: { name: mensageria-config }
            - secretRef: { name: mensageria-secret }
      containers:
        - name: api
          image: mensageria-api:local
          ports:
            - containerPort: 3000
            - containerPort: 9464 # métricas (interno; scrape do Prometheus in-cluster)
          envFrom:
            - configMapRef: { name: mensageria-config }
            - secretRef: { name: mensageria-secret }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mensageria
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
