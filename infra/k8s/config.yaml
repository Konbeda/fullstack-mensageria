apiVersion: v1
kind: ConfigMap
metadata:
  name: mensageria-config
  namespace: mensageria
data:
  NODE_ENV: production
  LOG_LEVEL: info
  MONGO_DB: mensageria
  PREFETCH: '10'
  MAX_ATTEMPTS: '3'
  RETRY_BASE_MS: '1000'
  RETRY_MAX_MS: '60000'
  CIRCUIT_FAILURE_THRESHOLD: '5'
  CIRCUIT_RESET_MS: '15000'
  PROVIDER_FAILURE_RATE: '0'
  PROVIDER_TIMEOUT_MS: '5000'
  HEALTH_PORT: '3100'
---
# Em produção real, gerencie estes valores com um secret manager (não versione credenciais).
apiVersion: v1
kind: Secret
metadata:
  name: mensageria-secret
  namespace: mensageria
type: Opaque
stringData:
  DATABASE_URL: postgres://mensageria:mensageria@postgres:5432/mensageria
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://mensageria:mensageria@rabbitmq:5672
  MONGO_URL: mongodb://mongo:27017
