server {
  listen 80;
  server_name _;

  # Proxy das chamadas de API para o serviço da API (mesma origem, sem CORS em produção).
  location /api/ {
    proxy_pass http://api:3000/;
  }

  # SPA: rotas do client-side caem no index.html.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
